# Next.js on Netlify – build and publish settings
# App lives at repo root; do not set "Base directory" in Netlify UI.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

# Admin dashboard must never be cached at the CDN (stale client lists).
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Long-cache static media (images rarely change; bump query or filename when they do)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js on Netlify – build and publish settings
# App lives at repo root; do not set "Base directory" in Netlify UI.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

# Long-cache immutable Next static assets (fonts, JS, CSS)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Admin dashboard must never be cached at the CDN (stale client lists).
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
